# PostgreSQL para AxiomCode — usuário e senha padrão do projeto: admin / 123456789
services:
  postgres:
    image: postgres:16-alpine
    container_name: axiomcode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: "123456789"
      POSTGRES_DB: axiomcode
    ports:
      - "5432:5432"
    volumes:
      - axiomcode_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d axiomcode"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  axiomcode_pgdata:
